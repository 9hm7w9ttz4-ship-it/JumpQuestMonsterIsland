<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Jump Quest Monster Island</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

html,body{

 width:100%;

 height:100%;

 overflow:hidden;

 font-family:Arial,sans-serif;

}

body{

 background:linear-gradient(#55c8ff,#b9f0ff);

 touch-action:none;

}

#game{

 position:relative;

 width:100%;

 height:100%;

 overflow:hidden;

}

#menu{

 position:absolute;

 inset:0;

 z-index:20;

 display:flex;

 flex-direction:column;

 justify-content:center;

 align-items:center;

 background:linear-gradient(#42bfff,#baf4ff);

 text-align:center;

}

#menu h1{

 font-size:38px;

 color:white;

 text-shadow:0 4px 5px #277da5;

 margin-bottom:12px;

}

#menu p{

 color:white;

 font-size:18px;

 margin-bottom:30px;

}

button{

 border:0;

 border-radius:22px;

 padding:16px 30px;

 font-size:22px;

 font-weight:bold;

 color:white;

 background:#ff8a00;

 box-shadow:0 5px 0 #c85f00;

}

button:active{

 transform:translateY(4px);

 box-shadow:0 1px 0 #c85f00;

}

#hud{

 position:absolute;

 top:15px;

 left:0;

 width:100%;

 z-index:10;

 display:flex;

 justify-content:space-between;

 padding:0 18px;

 color:white;

 font-size:22px;

 font-weight:bold;

 text-shadow:0 2px 3px #277da5;

}

#world{

 position:absolute;

 left:0;

 top:0;

 width:100%;

 height:100%;

}

.platform{

 position:absolute;

 height:28px;

 background:#39a852;

 border-bottom:8px solid #237436;

 border-radius:5px;

}

.coin{

 position:absolute;

 width:30px;

 height:30px;

 border-radius:50%;

 background:#ffd21c;

 border:3px solid #f5a900;

 display:flex;

 align-items:center;

 justify-content:center;

 font-size:16px;

 font-weight:bold;

 color:white;

 box-shadow:0 3px 5px #b77d00;

}

.monster{

 position:absolute;

 width:48px;

 height:42px;

 background:#8d43d6;

 border-radius:22px 22px 14px 14px;

 box-shadow:0 4px 0 #63299d;

}

.monster:before,

.monster:after{

 content:"";

 position:absolute;

 width:9px;

 height:9px;

 background:white;

 border-radius:50%;

 top:9px;

}

.monster:before{left:10px}

.monster:after{right:10px}

#player{

 position:absolute;

 width:48px;

 height:48px;

 background:#ffd21c;

 border-radius:50%;

 z-index:5;

 box-shadow:0 4px 0 #d99d00;

}

#player:before,

#player:after{

 content:"";

 position:absolute;

 width:6px;

 height:6px;

 background:#222;

 border-radius:50%;

 top:15px;

}

#player:before{left:13px}

#player:after{right:13px}

#controls{

 position:absolute;

 bottom:25px;

 left:0;

 width:100%;

 z-index:15;

 display:flex;

 justify-content:center;

}

#jump{

 width:150px;

 height:65px;

 border-radius:35px;

 background:#ff7a00;

 box-shadow:0 6px 0 #bd5200;

}

#message{

 position:absolute;

 inset:0;

 z-index:30;

 display:none;

 align-items:center;

 justify-content:center;

 flex-direction:column;

 background:rgba(0,0,0,.55);

 color:white;

 text-align:center;

}

#message h2{

 font-size:40px;

 margin-bottom:20px;

}

#message p{

 font-size:22px;

 margin-bottom:25px;

}

</style>

</head>

<body>

<div id="game">

<div id="menu">

<h1>🏝️ Jump Quest</h1>

<h1>👾 Monster Island</h1>

<p>Собери монеты и доберись до финиша!</p>

<button id="start">ИГРАТЬ ▶</button>

</div>

<div id="hud">

<div>🏝️ Level 1</div>

<div>⭐ <span id="score">0</span></div>

<div>❤️❤️❤️</div>

</div>

<div id="world">

<div class="platform" style="left:0;bottom:90px;width:100%;"></div>

<div class="platform" style="left:55%;bottom:220px;width:30%;"></div>

<div class="platform" style="left:10%;bottom:350px;width:28%;"></div>

<div class="platform" style="left:58%;bottom:480px;width:30%;"></div>

<div class="coin" id="coin1" style="left:55%;bottom:270px;">$</div>

<div class="coin" id="coin2" style="left:20%;bottom:400px;">$</div>

<div class="coin" id="coin3" style="left:70%;bottom:530px;">$</div>

<div class="monster" id="monster1" style="left:70%;bottom:118px;"></div>

<div id="player"></div>

</div>

<div id="controls">

<button id="jump">⬆️ ПРЫЖОК</button>

</div>

<div id="message">

<h2 id="messageTitle"></h2>

<p id="messageText"></p>

<button onclick="location.reload()">ИГРАТЬ СНОВА</button>

</div>

</div>

<script>

const player=document.getElementById("player");

const menu=document.getElementById("menu");

const start=document.getElementById("start");

const jumpBtn=document.getElementById("jump");

const scoreEl=document.getElementById("score");

const message=document.getElementById("message");

const messageTitle=document.getElementById("messageTitle");

const messageText=document.getElementById("messageText");

let x=60;

let y=0;

let velocityY=0;

let jumping=false;

let playing=false;

let score=0;

let collected=0;

function startGame(){

 menu.style.display="none";

 playing=true;

 x=60;

 y=0;

 velocityY=0;

 requestAnimationFrame(loop);

}

start.addEventListener("click",startGame);

function jump(){

 if(!playing)return;

 if(!jumping){

  velocityY=14;

  jumping=true;

 }

}

jumpBtn.addEventListener("touchstart",function(e){

 e.preventDefault();

 jump();

});

jumpBtn.addEventListener("click",jump);

document.addEventListener("keydown",function(e){

 if(e.code==="Space" || e.code==="ArrowUp"){

  jump();

 }

});

function loop(){

 if(!playing)return;

 velocityY-=0.65;

 y+=velocityY;

 if(y<=0){

  y=0;

  velocityY=0;

  jumping=false;

 }

 x+=1.2;

 if(x>window.innerWidth-60){

  x=window.innerWidth-60;

 }

 player.style.left=x+"px";

 player.style.bottom=(90+y)+"px";

 checkCoins();

 checkMonster();

 if(x>window.innerWidth-90 && y<100){

  win();

  return;

 }

 requestAnimationFrame(loop);

}

function checkCoins(){

 const coins=[

  document.getElementById("coin1"),

  document.getElementById("coin2"),

  document.getElementById("coin3")

 ];

 coins.forEach(c=>{

  if(c.style.display==="none")return;

  const r=c.getBoundingClientRect();

  const p=player.getBoundingClientRect();

  if(

   p.right>r.left &&

   p.left<r.right &&

   p.bottom>r.top &&

   p.top<r.bottom

  ){

   c.style.display="none";

   score+=10;

   collected++;

   scoreEl.textContent=score;

  }

 });

}

function checkMonster(){

 const monster=document.getElementById("monster1");

 if(monster.style.display==="none")return;

 const r=monster.getBoundingClientRect();

 const p=player.getBoundingClientRect();

 if(

  p.right>r.left &&

  p.left<r.right &&

  p.bottom>r.top &&

  p.top<r.bottom

 ){

  if(y>40){

   monster.style.display="none";

   score+=20;

   scoreEl.textContent=score;

  }else{

   lose();

  }

 }

}

function win(){

 playing=false;

 message.style.display="flex";

 messageTitle.textContent="🏆 ПОБЕДА!";

 messageText.textContent=

  "Ты прошёл Level 1! ⭐ Очки: "+score;

}

function lose(){

 playing=false;

 message.style.display="flex";

 messageTitle.textContent="💥 ОЙ!";

 messageText.textContent=

  "Монстр поймал тебя. Очки: "+score;

}

</script>

</body>

</html>
